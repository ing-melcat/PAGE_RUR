# Ejemplo de cómo añadir una segunda réplica por servicio para despliegues
# sin caída (fase 9 del plan). Es aditivo y opcional: fusionar con
# `docker compose -f docker-compose.yml -f docker-compose.replicas.example.yml up -d`
# una vez que el split de 3 servicios lleve varios días estable en
# producción. No cambia rutas ni comportamiento, solo agrega redundancia.
#
# El Caddyfile también necesita el bloque `reverse_proxy` de cada servicio
# actualizado para apuntar a las dos réplicas con health-check activo, ej.:
#
#   reverse_proxy @identity svc-identity:3001 svc-identity-b:3001 {
#       lb_policy round_robin
#       health_uri /api/hello
#       health_interval 10s
#   }
#
# Despliegue sin caída de una nueva versión: reconstruir y reiniciar una
# réplica a la vez (scripts/rollout.sh <servicio> haría esto), nunca las dos
# al mismo tiempo -- Caddy saca del balanceo la réplica que falla el
# health-check y sigue sirviendo con la otra mientras la primera se reinicia.

services:
  svc-identity-b:
    extends:
      file: docker-compose.yml
      service: svc-identity

  svc-content-b:
    extends:
      file: docker-compose.yml
      service: svc-content

  svc-robots-b:
    extends:
      file: docker-compose.yml
      service: svc-robots
