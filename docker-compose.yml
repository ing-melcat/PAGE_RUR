version: '3.8'

services:
  rur-web:
    build: .
    ports:
      - "80:3001" # Mapea el puerto 80 del host al 3001 del contenedor
    environment:
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET}
      # - CORS_ORIGIN=https://tudominio.com # Descomentar para restringir CORS
    volumes:
      - ./api/data:/app/api/data       # Persistencia de base de datos JSON
      - ./uploads:/app/api/uploads     # Persistencia de archivos subidos
    restart: unless-stopped
    networks:
      - rur_network

networks:
  rur_network:
    driver: bridge
