services:
  caddy:
    # Build custom (Dockerfile.caddy) en vez de la imagen oficial: incluye
    # el bouncer de CrowdSec (ver Caddyfile). Necesita alcanzar el LAPI de
    # CrowdSec -> también conectado a crowdsec_net.
    build:
      context: .
      dockerfile: Dockerfile.caddy
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - CROWDSEC_BOUNCER_API_KEY=${CROWDSEC_BOUNCER_API_KEY}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./dist-releases:/srv/releases:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - rur_network
      - crowdsec_net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M


  svc-identity:
    build:
      context: .
      dockerfile: services/identity/Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN:-https://rur.unipolidgo.edu.mx}
      - PGHOST=db
      - PGPORT=5432
      - PGUSER=svc_identity_role
      - PGPASSWORD=${IDENTITY_DB_PASSWORD}
      - PGDATABASE=${POSTGRES_DB}
    networks:
      - rur_network
      - rur_db_net
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  svc-content:
    build:
      context: .
      dockerfile: services/content/Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN:-https://rur.unipolidgo.edu.mx}
      - PGHOST=db
      - PGPORT=5432
      - PGUSER=svc_content_role
      - PGPASSWORD=${CONTENT_DB_PASSWORD}
      - PGDATABASE=${POSTGRES_DB}
      - LIBRETRANSLATE_URL=http://libretranslate:5000
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
    volumes:
      - ./uploads:/app/services/content/uploads
    networks:
      - rur_network
      - rur_db_net
      - translate_net
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Traduccion automatica del contenido de publicaciones (Fase B del
  # selector de idioma). Autohospedado a proposito: sin costo recurrente ni
  # llave de API externa que gestionar. Sin puerto publicado -- solo
  # alcanzable por svc-content, vía translate_net. `--load-only en,es`
  # porque solo hace falta ese par: sin esto descarga ~30 idiomas al
  # arrancar, mucho mas tiempo y espacio en disco de los que necesitamos.
  libretranslate:
    image: libretranslate/libretranslate:latest
    restart: unless-stopped
    command: ["--load-only", "en,es"]
    volumes:
      - libretranslate_data:/home/libretranslate/.local
    networks:
      - translate_net
    # Es el servicio con más pico de CPU del stack (carga de modelos +
    # traducción). Sin tope podía robarle recursos a svc-robots justo
    # durante una sesión de operador activa.
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  svc-robots:
    build:
      context: .
      dockerfile: services/robots/Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN:-https://rur.unipolidgo.edu.mx}
      - ROBOTS_SECRET_KEY=${ROBOTS_SECRET_KEY}
      - CROWDSEC_API_KEY=${CROWDSEC_API_KEY}
      - PGHOST=db
      - PGPORT=5432
      - PGUSER=svc_robots_role
      - PGPASSWORD=${ROBOTS_DB_PASSWORD}
      - PGDATABASE=${POSTGRES_DB}
    networks:
      - rur_network
      - rur_db_net
      - crowdsec_net
    depends_on:
      db:
        condition: service_healthy
    # El más sensible a latencia de los tres: es el que sirve el token de
    # LiveKit y los comandos del operador. Mismo tope que identity/content,
    # nunca menos.
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Postgres — reemplaza el almacenamiento en api/data/*.json. Instancia
  # propia de este proyecto (no se reutiliza el postgres-core de otro stack
  # del mismo VPS). Nunca expone 5432 al host: solo `expose`, alcanzable
  # exclusivamente desde rur_db_net.
  db:
    image: postgres:16-alpine
    container_name: page_rur_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_SUPERUSER_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - IDENTITY_DB_PASSWORD=${IDENTITY_DB_PASSWORD}
      - CONTENT_DB_PASSWORD=${CONTENT_DB_PASSWORD}
      - ROBOTS_DB_PASSWORD=${ROBOTS_DB_PASSWORD}
    expose:
      - "5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - rur_db_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G

  # pg_dump diario a un directorio fuera de cualquier ruta servida por la
  # web. Dataset pequeño -> retención de 14 días es prácticamente gratis.
  db-backup:
    build:
      context: .
      dockerfile: db/backup/Dockerfile
    restart: unless-stopped
    environment:
      - PGHOST=db
      - PGUSER=postgres
      - PGPASSWORD=${POSTGRES_SUPERUSER_PASSWORD}
      - PGDATABASE=${POSTGRES_DB}
      - RETAIN_DAYS=14
    volumes:
      - /home/rur/backups/pg:/backups
    networks:
      - rur_db_net
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

networks:
  rur_network:
    driver: bridge
  # Red interna: sin ruta de salida, solo alcanzable por los contenedores
  # que estén explícitamente conectados a ella (db + servicios backend).
  rur_db_net:
    driver: bridge
    internal: true
  # Red del stack de CrowdSec ya existente en este VPS (contenedor
  # `crowdsec`, definido fuera de este proyecto). Se referencia como
  # externa -- no la crea ni la gestiona este compose. Nombre real
  # confirmado en el host: crowdsec_crowdsec_net.
  crowdsec_net:
    external: true
    name: crowdsec_crowdsec_net
  # Aparte de rur_network a propósito: solo conecta svc-content con
  # libretranslate, nada más -- ni caddy ni los otros dos microservicios
  # tienen por qué poder alcanzarlo. Necesita ruta de salida (no internal)
  # porque LibreTranslate descarga los modelos de idioma de internet la
  # primera vez que arranca.
  translate_net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  pg_data:
  libretranslate_data: